services:
  unbrevable:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
